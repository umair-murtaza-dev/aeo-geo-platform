name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aeo
          POSTGRES_PASSWORD: aeo
          POSTGRES_DB: aeo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeo -d aeo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aeo:aeo@localhost:5432/aeo_test
      DIRECT_URL: postgresql://aeo:aeo@localhost:5432/aeo_test
      TEST_DATABASE_URL: postgresql://aeo:aeo@localhost:5432/aeo_test
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-test-secret-not-for-production-use-32
      AUTH_TRUST_HOST: 'true'
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations to the disposable CI database
        run: pnpm --filter @aeo/db exec prisma migrate deploy
      - name: Validate
        run: pnpm validate
      - name: Install Playwright browser
        run: pnpm --filter @aeo/web exec playwright install --with-deps chromium
      - name: Browser smoke
        run: pnpm --filter @aeo/web test:e2e
