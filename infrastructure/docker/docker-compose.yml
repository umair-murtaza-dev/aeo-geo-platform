# Disposable local dependencies for tests and the worker.
# This is not the Neon development database and it does not contain production data.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: aeo
      POSTGRES_DB: aeo_test
    ports:
      - '54329:5432'
